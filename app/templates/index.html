<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Churn Prediction System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>Customer Churn Prediction System</h1>

    <form id="churnForm">
        <label>Gender</label>
        <select name="gender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>

        <label>Senior Citizen</label>
        <select name="SeniorCitizen">
            <option value="0">No</option>
            <option value="1">Yes</option>
        </select>

        <label>Partner</label>
        <select name="Partner">
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>

        <label>Dependents</label>
        <select name="Dependents">
            <option value="No">No</option>
            <option value="Yes">Yes</option>
        </select>

        <label>Tenure (months)</label>
        <input type="number" name="tenure" value="12" required>

        <label>Phone Service</label>
        <select name="PhoneService">
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>

        <label>Multiple Lines</label>
        <select name="MultipleLines">
            <option value="No">No</option>
            <option value="Yes">Yes</option>
            <option value="No phone service">No phone service</option>
        </select>

        <label>Internet Service</label>
        <select name="InternetService">
            <option value="DSL">DSL</option>
            <option value="Fiber optic">Fiber optic</option>
            <option value="No">No</option>
        </select>

        <label>Online Security</label>
        <select name="OnlineSecurity">
            <option value="Yes">Yes</option>
            <option value="No">No</option>
            <option value="No internet service">No internet service</option>
        </select>

        <label>Online Backup</label>
        <select name="OnlineBackup">
            <option value="Yes">Yes</option>
            <option value="No">No</option>
            <option value="No internet service">No internet service</option>
        </select>

        <label>Device Protection</label>
        <select name="DeviceProtection">
            <option value="Yes">Yes</option>
            <option value="No">No</option>
            <option value="No internet service">No internet service</option>
        </select>

        <label>Tech Support</label>
        <select name="TechSupport">
            <option value="Yes">Yes</option>
            <option value="No">No</option>
            <option value="No internet service">No internet service</option>
        </select>

        <label>Streaming TV</label>
        <select name="StreamingTV">
            <option value="Yes">Yes</option>
            <option value="No">No</option>
            <option value="No internet service">No internet service</option>
        </select>

        <label>Streaming Movies</label>
        <select name="StreamingMovies">
            <option value="Yes">Yes</option>
            <option value="No">No</option>
            <option value="No internet service">No internet service</option>
        </select>

        <label>Contract</label>
        <select name="Contract">
            <option value="Month-to-month">Month-to-month</option>
            <option value="One year">One year</option>
            <option value="Two year">Two year</option>
        </select>

        <label>Paperless Billing</label>
        <select name="PaperlessBilling">
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>

        <label>Payment Method</label>
        <select name="PaymentMethod">
            <option value="Electronic check">Electronic check</option>
            <option value="Mailed check">Mailed check</option>
            <option value="Bank transfer (automatic)">Bank transfer (automatic)</option>
            <option value="Credit card (automatic)">Credit card (automatic)</option>
        </select>

        <label>Monthly Charges</label>
        <input type="number" step="0.01" name="MonthlyCharges" value="70.35" required>

        <label>Total Charges</label>
        <input type="number" step="0.01" name="TotalCharges" value="845.5" required>

        <button type="submit">Predict Churn</button>
    </form>

    <div id="result"></div>

    <script>
        document.getElementById("churnForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());

            const resultDiv = document.getElementById("result");
            resultDiv.style.display = "block";
            resultDiv.textContent = "Predicting...";
            resultDiv.className = "";

            try {
                const response = await fetch("/predict", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.error) {
                    resultDiv.textContent = "Error: " + result.error;
                    resultDiv.className = "churn-yes";
                } else {
                    resultDiv.textContent =
                        `Prediction: ${result.prediction} (Churn Probability: ${(result.churn_probability * 100).toFixed(2)}%)`;
                    resultDiv.className = result.prediction === "Yes" ? "churn-yes" : "churn-no";
                }
            } catch (err) {
                resultDiv.textContent = "Request failed: " + err;
                resultDiv.className = "churn-yes";
            }
        });
    </script>

</body>
</html>
